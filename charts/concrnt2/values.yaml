server:
  # backend names are kept from the concrnt2-migration chart (v2db, v2-redis,
  # v2-memcached) so an in-place `helm upgrade` from that chart keeps the
  # existing StatefulSets and their PVCs (= your data)
  dsn: "host=v2db user=postgres password=postgres dbname=concrnt port=5432 sslmode=disable"
  redisAddr: "v2-redis:6379"
  memcachedAddr: "v2-memcached:11211"
  captchaSitekey: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
  captchaSecret: "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
  vapidPublicKey: ""
  vapidPrivateKey: ""

observability:
  createPodMonitors: false
  enableTrace: false
  traceEndpoint: "alloy:4318"

concrnt2:
  appimage: ghcr.io/concrnt/concrnt:v1.11.9
  electorimage: ghcr.io/concrnt/k8s-elector:v1.11.8
  webimage: ghcr.io/concrnt/concrnt-web:main

  servicetype: ClusterIP
  fqdn: example.tld
  registration: invite
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  layer: concrnt-mainnet
  debug: false

  replicas: 1
  # cluster runs the k8s-elector sidecar next to every replica (leader
  # election via a coordination.k8s.io Lease + peer discovery via a headless
  # service) so replicas can be scaled freely. enable it before setting
  # replicas > 1.
  cluster:
    enabled: false

  # true時はConfigMapにprivatekeyを出力しないので、Secret concrnt2-secretの
  # secret.yamlに必ずprivatekeyを含めること(欠落は起動時panicで検出される)
  useSecret: false

  # conctl op gc-commitlog --backup s3://... 等をpod内で手動実行(kubectl exec)する
  # ためのAWS設定。Secret名を指定すると、そのキー config / credentials を
  # /etc/concrnt/aws にマウントし、AWS_CONFIG_FILE / AWS_SHARED_CREDENTIALS_FILE で
  # 指す(~/.aws/config・~/.aws/credentials と同じ書式。S3互換ストアは config 側の
  # endpoint_url、必要なら request_checksum_calculation = when_required)。
  # 空ならマウントしない
  awsSecret: ""

  # /.well-known/<name> で返す静的ドキュメント(concrnt config の
  # additionalWellKnown にそのまま渡す)。type は string(text/plain) か
  # json(application/json)。json の value は YAML マッピングでも JSON 文字列でもよい。
  # 例:
  #   additionalWellKnown:
  #     my-service:
  #       type: string
  #       value: "hello"
  #     my-json:
  #       type: json
  #       value:
  #         links:
  #           - rel: self
  #             href: https://example.com/
  additionalWellKnown: {}

profile:
  nickname: concrnt-domain
  description: domain description
  logo: ""
  wordmark: ""
  themeColor: "#20193b"
  maintainerName: changeme
  maintainerEmail: changeme@example.com

mediaserver:
  enabled: false
  useSecret: false
  image: ghcr.io/concrnt/storage-s3:v1.0.1
  bucketName: YOUR_BUCKET_NAME
  endpointUrl: https://xxxxxx.r2.cloudflarestorage.com
  accessKeyId: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  accessKeySecret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  publicBaseUrl: https://pub-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev/
  region: auto
  quota: "1000000000"

hyperproxy:
  enabled: true
  image: ghcr.io/concrnt/hyperproxy:v0.5.1

# v2 ActivityPubブリッジ (github.com/concrnt/activitypub)
# ブロック名はconcrnt2-migrationチャートと同じactivitypub2にしてあり、移行時の
# values.yamlをそのまま持ち回れる(残っているv1用activitypub:ブロックは無視される)。
# migrationチャートのactiveキーはこのチャートでは不要(enabledだけでデプロイと/ap経路登録が行われる)
activitypub2:
  enabled: false
  # concrnt2.useSecretと同じprojected方式: ConfigMapに加えてSecret activitypub2-secretを
  # 同じconfigディレクトリに重ねる。Secretのキーはsecret.yaml(config.yamlより後に読まれて
  # 深いマージで上書きされる)で、privatekey等の秘匿値だけを部分YAMLで書く。
  # useSecret時はConfigMap側config.yamlにprivateKeyを出力しない(下のプレースホルダが
  # 誤って使われる事故防止)ので、Secretに必ずprivateKeyを含めること(欠落は起動時エラー)
  useSecret: false
  image: ghcr.io/concrnt/activitypub:latest
  # ブリッジ用サービスアカウントの秘密鍵(conctl operation create-account で作成。
  # ccidは鍵から導出される)
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # URL形式のみ(libpqキーワード形式は不可)。v2コアとDB・Redisを共有する
  databaseUrl: "postgres://postgres:postgres@v2db:5432/concrnt"
  redisUrl: "redis://v2-redis:6379"

# atproto(Bluesky)ブリッジ (github.com/concrnt/atproto)
# 1ポート(8010)で管理API(/atproto・認証あり)と公開PDS面(/xrpc・認証なし)を
# 配信し、どちらもconcrnt2ゲートウェイのservicesに登録して経由させる(ブリッジの
# ポートを直接公開してはいけない: 管理APIはゲートウェイが付けるcc-requesterを信頼する)。
# PDSのserviceEndpointはconcrnt2.fqdnそのものなので専用ドメインは不要。
# carstore/blob/firehoseログを/dataに持つためStatefulSet+PVCでデプロイする
atproto:
  enabled: false
  # activitypub2.useSecretと同じprojected方式: ConfigMapに加えてSecret atproto-secretを
  # 同じconfigディレクトリに重ねる。Secretのキーはsecret.yaml(config.yamlより後に読まれて
  # 深いマージで上書きされる)で、秘匿値だけを部分YAMLで書く:
  #   concrnt: {privateKey: ...}
  #   atproto: {masterRotationKey: ..., keyEncryptionKey: ...}
  # useSecret時はConfigMap側config.yamlにこれら3値を出力しない(下のプレースホルダが
  # 誤って使われる事故防止)ので、Secretに必ず3つとも含めること(欠落は起動時エラー)
  useSecret: false
  image: ghcr.io/concrnt/atproto:latest
  # ブリッジ用サービスアカウント(conctl operation create-account で作成)。
  # atprotoブリッジはccidを鍵から導出しないので両方書く
  ccid: con1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # 全ブリッジDIDのPLC rotation key(K256秘密鍵・multibaseかhex)。漏洩すると全アカウントの
  # DIDを乗っ取れるので本番はuseSecret推奨
  masterRotationKey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # アカウント毎の署名鍵を保存時に暗号化する鍵(32バイトhex)。変更すると既存の鍵が読めなくなる
  keyEncryptionKey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # URL形式のみ。テーブルは全てat_プレフィックスなのでv2コアとDBを共有できる
  databaseUrl: "postgres://postgres:postgres@v2db:5432/concrnt"
  # 必ずv2コアと同じRedis(イベントをPSUBSCRIBEで購読する)
  redisUrl: "redis://v2-redis:6379"
  # 300グラフェン超過時にBluesky側へ載せる元投稿パーマリンク。{uri}がcckv URIに置換される
  postUrlTemplate: "https://world.concrnt.net/post?uri={uri}"
  # carstore / blob / firehoseイベントログの永続ボリューム
  storage: "4Gi"
  # 以下は空ならブリッジ既定値(plc.directory / bsky.network / jetstream2.us-east /
  # public.api.bsky.app / 72h)
  plcDirectory: ""
  relays: []
  jetstream: ""
  appviewUrl: ""
  firehoseRetentionHours: 0
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

legal:
  tos: ""
  # /robots.txt の本文(/etc/concrnt/static/robots.txt)。空ならファイルを置かず
  # /robots.txt は 404。concrnt crawler に索引されたくない場合の例:
  #   robotsTxt: |
  #     User-agent: concrnt-crawler
  #     Disallow: /
  robotsTxt: ""
  registerTemplate: |
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "title": "名前",
          "description": "ご連絡が必要になった場合に用いる宛名　ハンドルネーム推奨"
        },
        "consent": {
          "type": "boolean",
          "title": "利用規約・行動規範およびプライバシーポリシーに同意します",
          "default": null,
          "enum": [
            null,
            true
          ]
        }
      },
      "required": [
        "name",
        "consent"
      ]
    }
  codeOfConduct: |
    1. サーバーは日本国内に設置されています。日本の法律に従ってください。
    2. 他者へのリスペクトを忘れないようにしましょう。
    3. ユーザー名・アイコン・ステータスメッセージなどは他者を不快にさせるようなものは控え、投稿も内容によっては公開範囲をコントロールしましょう。
    4. コミュニティタイムラインでは、そのコミュニティの趣旨をくみ取り、適切な投稿を心がけましょう。

postgres:
  enabled: true
  storage: "1Gi"
  mountPath: "/var/lib/postgresql"
  createExporter: false
  useSecret: false

redis:
  enabled: true
  storage: "1Gi"
  createExporter: false

memcached:
  enabled: true
  createExporter: false

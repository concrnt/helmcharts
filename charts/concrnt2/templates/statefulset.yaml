{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: v2db
spec:
  replicas: 1
  serviceName: v2db
  selector:
    matchLabels:
      name: v2db
  template:
    metadata:
      labels:
        name: v2db
    spec:
      containers:
        - name: posgresql
          image: docker.io/postgres:18-bookworm
          ports:
            - name: postgres
              containerPort: 5432
{{- if .Values.postgres.useSecret }}
          envFrom:
            - secretRef:
                name: postgres-secret
{{- else }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: concrnt
{{- end }}
          volumeMounts:
            - name: postgres-varlib
              mountPath: {{ .Values.postgres.mountPath }}
{{- if .Values.postgres.createExporter }}
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter
          ports:
            - name: postgres-expr
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable"
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-varlib
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}

---

{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: v2-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      name: v2-redis
  template:
    metadata:
      labels:
        name: v2-redis
    spec:
      containers:
      - name: redis
        image: docker.io/redis:7-bookworm
        ports:
          - name: redis
            containerPort: 6379
        volumeMounts:
          - name: redis-data
            mountPath: /data
{{- if .Values.redis.createExporter }}
      - name: redis-exporter
        image: docker.io/oliver006/redis_exporter:v1.6.0-alpine
        ports:
          - name: redis-exporter
            containerPort: 9121
        args:
          - "--redis.addr=redis://localhost:6379"
{{- end }}
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.redis.storage }}
{{- end }}

---

{{- if .Values.atproto.enabled }}
# atproto(Bluesky)ブリッジ。/dataにcarstore・blob・firehoseイベントログを持つので
# StatefulSet(replicas固定1: repo書き込みとfirehose順序を単一プロセスが担う)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atproto
spec:
  replicas: 1
  serviceName: atproto
  selector:
    matchLabels:
      name: atproto
  template:
    metadata:
      labels:
        name: atproto
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/atproto-config.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: atproto
        image: {{ .Values.atproto.image }}
        ports:
          - name: web
            containerPort: 8010
        env:
          # ディレクトリ指定: config.yaml(ConfigMap)+secret.yaml(Secret)を名前順に深いマージ
          - name: CONFIG_PATH
            value: /etc/concrnt/atproto/config
        livenessProbe:
          httpGet:
            path: /health
            port: web
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
{{ toYaml .Values.atproto.resources | indent 10 }}
        volumeMounts:
          - name: atproto-config
            mountPath: /etc/concrnt/atproto/config
            readOnly: true
          - name: atproto-data
            mountPath: /data
      volumes:
{{- if .Values.atproto.useSecret }}
        - name: atproto-config
          projected:
            sources:
              - configMap:
                  name: atproto-config
              - secret:
                  name: atproto-secret
{{- else }}
        - name: atproto-config
          configMap:
            name: atproto-config
{{- end }}
  volumeClaimTemplates:
  - metadata:
      name: atproto-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.atproto.storage }}
{{- end }}

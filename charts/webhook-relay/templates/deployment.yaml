apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-relay
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      name: webhook-relay
  template:
    metadata:
      labels:
        name: webhook-relay
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: webhook-relay
        image: {{ .Values.image }}
        ports:
          - name: web
            containerPort: 8080
{{- if .Values.useSecret }}
        env:
          - name: PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: webhook-relay-secret
                key: PRIVATE_KEY
{{- end }}
        # POST専用のwebhookエンドポイントしか持たないのでTCP疎通で生存確認する
        livenessProbe:
          tcpSocket:
            port: web
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
{{ toYaml .Values.resources | indent 10 }}
        volumeMounts:
          - name: webhook-relay-config
            mountPath: /app
            readOnly: true
      volumes:
        - name: webhook-relay-config
          configMap:
            name: webhook-relay-config

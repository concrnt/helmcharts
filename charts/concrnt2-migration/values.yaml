server:
  dsn: "host=db user=postgres password=postgres dbname=concrnt port=5432 sslmode=disable"
  dsn2: "host=v2db user=postgres password=postgres dbname=concrnt port=5432 sslmode=disable"
  redisAddr: "redis:6379"
  redisAddr2: "v2-redis:6379"
  memcachedAddr: "memcached:11211"
  memcachedAddr2: "v2-memcached:11211"
  captchaSitekey: "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"
  captchaSecret: "6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe"
  vapidPublicKey: ""
  vapidPrivateKey: ""

observability:
  createPodMonitors: false
  enableTrace: false
  traceEndpoint: "alloy:4318"

concrnt:
  appimage: ghcr.io/concrnt/ccapi:v1.7.7
  gatewayimage: ghcr.io/concrnt/ccgateway:v1.7.7
  webimage: ghcr.io/concrnt/web-dashboard:v0.0.6

  servicetype: ClusterIP
  fqdn: example.tld
  registration: invite
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  dimension: concrnt-mainnet

  useSecret: false
  configpaths: "" # "/etc/concrnt/config/config.yaml:/etc/concrnt/secret/config.yaml"

concrnt2:
  appimage: ghcr.io/concrnt/concrnt:v1.10.29
  webimage: ghcr.io/concrnt/concrnt-web:main

  servicetype: ClusterIP
  fqdn: example.tld
  registration: invite
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  layer: concrnt-mainnet

  # true時はConfigMapにprivatekeyを出力しないので、Secret concrnt2-secretの
  # secret.yamlに必ずprivatekeyを含めること(欠落は起動時panicで検出される)
  useSecret: false
  configpaths: "" # "/etc/concrnt/config/config.yaml:/etc/concrnt/secret/config.yaml"

profile:
  nickname: concrnt-domain
  description: domain description
  logo: ""
  wordmark: ""
  themeColor: "#20193b"
  maintainerName: changeme
  maintainerEmail: changeme@example.com

search:
  enabled: false
  image: ghcr.io/concrnt/cc-search:v0.1.2
  useSecret: false
  meilisearchKey: "concrnt-meilisearch"
  meilisearchUrl: "http://meilisearch:7700"
  meilisearchIdx: "concrnt"

mediaserver:
  enabled: false
  useSecret: false
  image: ghcr.io/totegamma/cc-media-server:v0.5.0
  image2: ghcr.io/totegamma/cc-media-server:v1.0.0-beta4
  bucketName: YOUR_BUCKET_NAME
  endpointUrl: https://xxxxxx.r2.cloudflarestorage.com
  accessKeyId: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  accessKeySecret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  publicBaseUrl: https://pub-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev/
  region: auto
  quota: "1000000000"

activitypub:
  enabled: false
  useSecret: false
  image: ghcr.io/concrnt/ccworld-ap-bridge:v0.6.5
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  configpaths: "" # "/etc/concrnt/config/config.yaml:/etc/concrnt/secret/config.yaml"

# v2 ActivityPubブリッジ (github.com/concrnt/activitypub)
# enabled: v2ブリッジをv1ブリッジと並列でデプロイする(公開経路はまだ変わらない)
# active:  /ap と .well-known/{webfinger,nodeinfo,host-meta} の向き先をv1からv2へ切り替える
#          (enabledがtrueのときのみ有効。conctl migrate ap-v1-to-v2 の完了後にtrueにすること)
activitypub2:
  enabled: false
  active: false
  # concrnt2.useSecretと同じprojected方式: ConfigMapに加えてSecret activitypub2-secretを
  # 同じconfigディレクトリに重ねる。Secretのキーはsecret.yaml(config.yamlより後に読まれて
  # 深いマージで上書きされる)で、privatekey等の秘匿値だけを部分YAMLで書く。
  # useSecret時はConfigMap側config.yamlにprivateKeyを出力しない(下のプレースホルダが
  # 誤って使われる事故防止)ので、Secretに必ずprivateKeyを含めること(欠落は起動時エラー)
  useSecret: false
  image: ghcr.io/concrnt/activitypub:latest
  # ブリッジ用サービスアカウントの秘密鍵。v1ブリッジのアカウント(activitypub.privatekey)を
  # 引き継ぐか、conctl operation create-account で新規作成する(ccidは鍵から導出される)
  privatekey: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # URL形式のみ(libpqキーワード形式は不可)。v2コアとDB・Redisを共有する
  databaseUrl: "postgres://postgres:postgres@v2db:5432/concrnt"
  redisUrl: "redis://v2-redis:6379"

hyperproxy:
  enabled: true
  image: ghcr.io/concrnt/hyperproxy:v0.5.0

legal:
  tos: ""
  registerTemplate: |
    {
      "type": "object",
      "properties": {
        "name": {
          "type": "string",
          "title": "名前",
          "description": "ご連絡が必要になった場合に用いる宛名　ハンドルネーム推奨"
        },
        "consent": {
          "type": "boolean",
          "title": "利用規約・行動規範およびプライバシーポリシーに同意します",
          "default": null,
          "enum": [
            null,
            true
          ]
        }
      },
      "required": [
        "name",
        "consent"
      ]
    }
  codeOfConduct: |
    1. サーバーは日本国内に設置されています。日本の法律に従ってください。
    2. 他者へのリスペクトを忘れないようにしましょう。
    3. ユーザー名・アイコン・ステータスメッセージなどは他者を不快にさせるようなものは控え、投稿も内容によっては公開範囲をコントロールしましょう。
    4. コミュニティタイムラインでは、そのコミュニティの趣旨をくみ取り、適切な投稿を心がけましょう。

postgres:
  enabled: true
  storage: "1Gi"
  mountPath: "/var/lib/postgresql/data"
  mountPath2: "/var/lib/postgresql"
  createExporter: false
  useSecret: false

redis:
  enabled: true
  storage: "1Gi"
  createExporter: false

memcached:
  enabled: true
  createExporter: false

meilisearch:
  enabled: false
  useSecret: false
  image: docker.io/getmeili/meilisearch:prototype-japanese-13
  storage: "1Gi"

